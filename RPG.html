<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sombras de Paranapiacaba - Mapa Sombrio Nativo</title>
    
    <!-- Biblioteca LEAFLET.JS (Motor do Mapa Real) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-color: #050505;
            --iron: #4a4a4a;
            --accent-blue: #4c4cff;
            --accent-red: #ff4c4c;
        }
        
        * { box-sizing: border-box; user-select: none; }
        
        body {
            margin: 0; padding: 0;
            background-color: #0a0a0a;
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; overflow: hidden;
        }

        #mobile-container {
            position: relative;
            width: 100%; max-width: 450px; 
            height: 100%; max-height: 850px;
            background-color: var(--bg-color);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-left: 1px solid #222; border-right: 1px solid #222;
            overflow: hidden;
        }

        /* O VIEWPORT QUADRADO */
        #viewport {
            position: absolute; top: 0; left: 0;
            width: 100%; aspect-ratio: 1 / 1; 
            background-color: #000;
            overflow: hidden; 
            border-bottom: 2px solid var(--iron);
        }

        /* O CONTAINER DO MAPA REAL */
        #map {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background: #000; /* Fundo preto para as bordas não carregadas */
        }

        /* Esconde os créditos do mapa da tela para manter a imersão de jogo */
        .leaflet-control-attribution { display: none !important; }

        /* O CANVAS DA NEBLINA (Fica por cima do mapa real) */
        #fog-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            filter: blur(12px); /* Borracha mais esfumaçada */
            pointer-events: none; 
        }

        /* O AVATAR DO JOGADOR */
        #player-marker {
            position: absolute;
            width: 20px; height: 20px; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            background-color: var(--accent-red); 
            border: 2px solid white; border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 50, 50, 0.8);
            z-index: 10;
        }

        /* --- PAINEL GPS DEBUG --- */
        #gps-status-panel {
            position: absolute; 
            top: calc(100vw + 10px); 
            left: 50%; transform: translateX(-50%);
            width: 90%; background: #111; border: 1px solid var(--iron);
            border-radius: 8px; padding: 10px; color: #ccc;
            text-align: center; z-index: 20; font-size: 0.8rem;
        }
        .status-led {
            display: inline-block; width: 10px; height: 10px;
            background: orange; border-radius: 50%; margin-right: 5px;
            box-shadow: 0 0 5px orange;
        }

        /* --- CONTROLES WASD (SIMULADOR DE PASSOS GPS) --- */
        #gps-simulator {
            position: absolute; 
            top: calc(100vw + 60px); 
            left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: 50px 50px 50px;
            gap: 8px; z-index: 20; 
        }
        @media (min-width: 450px) { #gps-simulator { top: calc(450px + 60px); } }

        .gps-btn {
            background: #1a1a1a; border: 1px solid var(--iron);
            color: white; padding: 12px 0; border-radius: 8px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .gps-btn:active { background: #444; }
        .gps-up { grid-column: 2; grid-row: 1; }
        .gps-left { grid-column: 1; grid-row: 2; }
        .gps-right { grid-column: 3; grid-row: 2; }
        .gps-down { grid-column: 2; grid-row: 3; }

        /* --- HUD INFERIOR --- */
        #hud-bottom {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 90px;
            background: linear-gradient(to top, #0a0a0c, transparent);
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 0 10px 10px 10px; z-index: 30;
        }

        .orb {
            width: 60px; height: 60px; border-radius: 50%;
            border: 3px solid var(--iron);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
            position: relative; overflow: hidden; background: #111;
        }
        .orb-liquid {
            position: absolute; bottom: 0; width: 100%; height: 100%;
        }
        .orb-red .orb-liquid { background: radial-gradient(circle at 50% top, var(--accent-red), #8b0000); }
        .orb-blue .orb-liquid { background: radial-gradient(circle at 50% top, var(--accent-blue), #00008b); }

        .action-bar { display: flex; gap: 5px; }
        .action-btn {
            background: #1a1a1a; border: 1px solid var(--iron); color: #ccc;
            padding: 10px; border-radius: 8px; font-size: 0.75rem; cursor: pointer;
        }
        .btn-main { background: #333; color: white; font-weight: bold; border-color: #888; }
        .btn-map-active { background: #8b0000 !important; color: white !important; font-weight: bold; }
    </style>
</head>
<body>

<div id="mobile-container">
    <div id="viewport">
        <!-- Motor do Mapa Real -->
        <div id="map"></div>
        <!-- Canvas da Neblina por cima -->
        <canvas id="fog-canvas"></canvas>
        <!-- Avatar sempre no centro -->
        <div id="player-marker"></div>
    </div>

    <div id="gps-status-panel">
        <div style="font-weight: bold; margin-bottom: 3px;">
            <span class="status-led" id="led-gps"></span> 
            <span id="txt-gps">Buscando Satélite...</span>
        </div>
        <div style="font-size: 0.7rem; color: #888;">
            Ande na rua ou use o WASD para injetar coordenadas.
        </div>
    </div>

    <!-- Simulador de Passos -->
    <div id="gps-simulator">
        <div class="gps-btn gps-up" id="btn-w">W</div>
        <div class="gps-btn gps-left" id="btn-a">A</div>
        <div class="gps-btn gps-down" id="btn-s">S</div>
        <div class="gps-btn gps-right" id="btn-d">D</div>
    </div>

    <!-- HUD INFERIOR -->
    <div id="hud-bottom">
        <div class="orb orb-red"><div class="orb-liquid" id="orb-vida"></div></div>
        <div class="action-bar">
            <button class="action-btn" id="btn-mapa" onclick="toggleMapa()">MAPA</button>
            <button class="action-btn btn-main">ESCANEAR</button>
            <button class="action-btn">Magia</button>
        </div>
        <div class="orb orb-blue"><div class="orb-liquid" id="orb-mana"></div></div>
    </div>
</div>

<script>
    let map;
    const canvas = document.getElementById('fog-canvas');
    const ctx = canvas.getContext('2d');
    
    // Coordenada inicial de Fallback (São Caetano do Sul)
    let currentLatLng = [-23.6225, -46.5546]; 
    let initialZoom = 18; 
    
    let visitedPath = [];
    let isMapOpen = false;
    let eraserRadius = 60;

    const keys = { w: false, a: false, s: false, d: false };

    function inicializarJogo() {
        // 1. INICIALIZA O MOTOR DE MAPAS LEAFLET
        map = L.map('map', {
            zoomControl: false, 
            dragging: false,       
            scrollWheelZoom: false,
            doubleClickZoom: false,
            touchZoom: false
        }).setView(currentLatLng, initialZoom);

        // O NOVO MAPA: CARTO Dark Matter (Já é escuro, rápido e não bloqueia arquivos locais)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            maxZoom: 19
        }).addTo(map);

        // 2. CONFIGURA O CANVAS DA NEBLINA
        redimensionarCanvas();
        window.addEventListener('resize', redimensionarCanvas);
        visitedPath.push([...currentLatLng]);

        // 3. INICIA SISTEMAS
        iniciarGPS();
        requestAnimationFrame(gameLoop);
    }

    function redimensionarCanvas() {
        const vp = document.getElementById('viewport');
        canvas.width = vp.clientWidth;
        canvas.height = vp.clientHeight;
    }

    // ==========================================
    // SISTEMA DE RASTREAMENTO GPS (REAL)
    // ==========================================
    function iniciarGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(atualizarPosicaoGPS, erroGPS, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 5000
            });
        } else {
            document.getElementById('txt-gps').innerText = "Sem Suporte a GPS.";
            document.getElementById('led-gps').style.background = "red";
        }
    }

    function atualizarPosicaoGPS(posicao) {
        currentLatLng = [posicao.coords.latitude, posicao.coords.longitude];
        document.getElementById('txt-gps').innerText = `Sinal Real | Precisão: ${Math.round(posicao.coords.accuracy)}m`;
        document.getElementById('led-gps').style.background = "#00ff00"; 
        document.getElementById('led-gps').style.boxShadow = "0 0 10px #00ff00";
        salvarRastro();
    }

    function erroGPS(err) {
        document.getElementById('txt-gps').innerText = "Usando GPS Simulado (WASD)";
        document.getElementById('led-gps').style.background = "yellow";
        document.getElementById('led-gps').style.boxShadow = "0 0 10px yellow";
    }

    // ==========================================
    // SISTEMA DE GPS SIMULADO (DEBUG WASD)
    // ==========================================
    function ligarBotao(id, key) {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }, {passive: false});
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; }, {passive: false});
        btn.addEventListener('mousedown', () => keys[key] = true);
        btn.addEventListener('mouseup', () => keys[key] = false);
        btn.addEventListener('mouseleave', () => keys[key] = false);
    }
    ligarBotao('btn-w', 'w'); ligarBotao('btn-a', 'a'); ligarBotao('btn-s', 's'); ligarBotao('btn-d', 'd');
    
    window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

    function simularPassos() {
        let moveu = false;
        // 0.00001 graus de lat/lng é aprox. 1 metro (Velocidade de caminhada no debug)
        const passo = 0.000015; 
        
        if (keys.w) { currentLatLng[0] += passo; moveu = true; } // Norte
        if (keys.s) { currentLatLng[0] -= passo; moveu = true; } // Sul
        if (keys.a) { currentLatLng[1] -= passo; moveu = true; } // Oeste
        if (keys.d) { currentLatLng[1] += passo; moveu = true; } // Leste

        if (moveu) {
            document.getElementById('txt-gps').innerText = `Simulação WASD Ativa`;
            document.getElementById('led-gps').style.background = "yellow"; 
            document.getElementById('led-gps').style.boxShadow = "0 0 10px yellow";
            salvarRastro();
        }
    }

    // ==========================================
    // MEMÓRIA DA NEBLINA (RASTRO)
    // ==========================================
    function salvarRastro() {
        const ultimoPonto = visitedPath[visitedPath.length - 1];
        if (!ultimoPonto) {
            visitedPath.push([...currentLatLng]);
            return;
        }
        const distMetros = map.distance(ultimoPonto, currentLatLng);
        if (distMetros > 2) {
            visitedPath.push([...currentLatLng]);
        }
    }

    // ==========================================
    // FUNÇÃO DE MAPA GLOBAL
    // ==========================================
    function toggleMapa() {
        isMapOpen = !isMapOpen;
        const btn = document.getElementById('btn-mapa');
        
        if (isMapOpen) {
            btn.innerText = "VOLTAR";
            btn.classList.add('btn-map-active');
            map.dragging.enable();
            map.setZoom(15);
        } else {
            btn.innerText = "MAPA";
            btn.classList.remove('btn-map-active');
            map.dragging.disable();
            map.setView(currentLatLng, initialZoom);
        }
    }

    // ==========================================
    // O MOTOR DE RENDERIZAÇÃO 
    // ==========================================
    function gameLoop() {
        if (!isMapOpen) {
            simularPassos();
            map.panTo(currentLatLng, {animate: false}); 
        }

        // --- DESENHA A NEBLINA ---
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(20, 25, 30, 0.98)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.globalCompositeOperation = 'destination-out';

        for (let i = 0; i < visitedPath.length; i++) {
            // Converte coordenada Lat/Lng do mundo real em Posição Pixel na tela
            let pontoNaTela = map.latLngToContainerPoint(visitedPath[i]);
            
            let eraser = ctx.createRadialGradient(pontoNaTela.x, pontoNaTela.y, 0, pontoNaTela.x, pontoNaTela.y, eraserRadius);
            eraser.addColorStop(0, 'rgba(0, 0, 0, 1)');
            eraser.addColorStop(0.5, 'rgba(0, 0, 0, 0.8)');
            eraser.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = eraser;
            ctx.beginPath();
            ctx.arc(pontoNaTela.x, pontoNaTela.y, eraserRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        requestAnimationFrame(gameLoop);
    }

    window.onload = inicializarJogo;
</script>

</body>
</html>
