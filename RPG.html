<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Ajuste crucial para o PWA: impede zoom e ajusta a escala -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Sombras de Paranapiacaba</title>
    
    <!-- CONEXÃO COM O PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-color: #050505;
            --iron: #4a4a4a;
            --accent-blue: #4c4cff;
            --accent-red: #ff4c4c;
        }
        
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            background-color: #0a0a0a;
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
            /* 100dvh resolve o problema do corte inferior nos celulares */
            height: 100dvh; width: 100vw; overflow: hidden;
        }

        #mobile-container {
            position: relative;
            width: 100%; max-width: 450px; 
            height: 100%; max-height: 100dvh;
            background-color: var(--bg-color);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        #viewport {
            position: absolute; top: 0; left: 0;
            width: 100%; aspect-ratio: 1 / 1; 
            background-color: #000;
            overflow: hidden; 
            border-bottom: 2px solid var(--iron);
        }

        #map {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background: #000; 
        }

        .leaflet-control-attribution { display: none !important; }

        #fog-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none; 
        }

        #player-marker {
            position: absolute;
            width: 20px; height: 20px; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            background-color: var(--accent-red); 
            border: 2px solid white; border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 50, 50, 0.8);
            z-index: 10;
            display: none; /* Só aparece quando o GPS for encontrado */
        }

        #gps-status-panel {
            position: absolute; 
            top: calc(100vw + 15px); 
            left: 50%; transform: translateX(-50%);
            width: 90%; background: #111; border: 1px solid var(--iron);
            border-radius: 8px; padding: 12px; color: #ccc;
            text-align: center; z-index: 20; font-size: 0.8rem;
        }
        .status-led {
            display: inline-block; width: 10px; height: 10px;
            background: orange; border-radius: 50%; margin-right: 5px;
            box-shadow: 0 0 5px orange;
        }

        .radar-pulse {
            position: absolute; width: 10px; height: 10px;
            background: transparent; border: 2px solid rgba(76, 76, 255, 0.8);
            border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 5; pointer-events: none;
            animation: pulse-anim 1.5s ease-out forwards;
        }
        @keyframes pulse-anim {
            0% { width: 10px; height: 10px; opacity: 1; border-width: 5px; }
            100% { width: 300px; height: 300px; opacity: 0; border-width: 1px; }
        }

        #inventory-overlay {
            position: absolute; top: 5%; left: 5%;
            width: 90%; height: 85%; background: rgba(15, 15, 15, 0.95);
            border: 1px solid var(--iron); border-radius: 10px;
            z-index: 50; display: none; flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.9); color: white; padding: 15px;
        }
        .inv-header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px;}
        .inv-close { background: red; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .inv-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { flex: 1; background: #222; color: #888; border: 1px solid #333; padding: 10px 0; cursor: pointer; }
        .tab-btn.active { background: #333; color: white; border-color: var(--iron); }
        .inv-content { flex: 1; background: #0a0a0a; border: 1px inset #222; padding: 10px; overflow-y: auto; }
        .item-slot { background: #1a1a1a; border: 1px solid #333; padding: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        .item-btn { background: var(--accent-red); color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-weight: bold;}

        #hud-bottom {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 90px;
            background: linear-gradient(to top, #0a0a0c, transparent);
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 0 10px 10px 10px; z-index: 30;
        }

        .orb {
            width: 60px; height: 60px; border-radius: 50%;
            border: 3px solid var(--iron);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
            position: relative; overflow: hidden; background: #111;
        }
        .orb-liquid {
            position: absolute; bottom: 0; width: 100%; height: 100%;
            transition: height 0.2s linear;
        }
        .orb-red .orb-liquid { background: radial-gradient(circle at 50% top, var(--accent-red), #8b0000); }
        .orb-blue .orb-liquid { background: radial-gradient(circle at 50% top, var(--accent-blue), #00008b); }

        .action-bar { display: flex; gap: 5px; }
        .action-btn {
            background: #1a1a1a; border: 1px solid var(--iron); color: #ccc;
            padding: 10px; border-radius: 8px; font-size: 0.75rem; cursor: pointer;
        }
        .btn-main { background: #333; color: white; font-weight: bold; border-color: #888; }
        .btn-map-active { background: #8b0000 !important; color: white !important; font-weight: bold; }
        .btn-cooldown { background: #111 !important; color: #444 !important; border-color: #333 !important; pointer-events: none; }
    </style>
</head>
<body>

<div id="mobile-container">
    <div id="inventory-overlay">
        <div class="inv-header">
            <strong>MOCHILA</strong>
            <button class="inv-close" onclick="toggleMochila()">X</button>
        </div>
        <div class="inv-tabs">
            <button class="tab-btn active">Consumíveis</button>
            <button class="tab-btn">Chaves</button>
            <button class="tab-btn">Diário</button>
        </div>
        <div class="inv-content">
            <div class="item-slot">
                <div>☕ Garrafa de Café <br><small>Restaura 30% Sanidade</small></div>
                <button class="item-btn" onclick="usarItemVida()">USAR</button>
            </div>
            <div class="item-slot" style="opacity: 0.5;">
                <div>📜 Selo de Sal <br><small>Vazio</small></div>
            </div>
        </div>
    </div>

    <div id="viewport">
        <div id="map"></div>
        <canvas id="fog-canvas"></canvas>
        <div id="player-marker"></div>
    </div>

    <div id="gps-status-panel">
        <div style="font-weight: bold; margin-bottom: 3px;">
            <span class="status-led" id="led-gps"></span> 
            <span id="txt-gps">Aguardando Localização...</span>
        </div>
        <div style="font-size: 0.7rem; color: #888;">
            A Neblina abrirá quando o sinal for encontrado.
        </div>
    </div>

    <div id="hud-bottom">
        <div class="orb orb-red"><div class="orb-liquid" id="orb-vida"></div></div>
        <div class="action-bar">
            <button class="action-btn" onclick="toggleMochila()">MOCHILA</button>
            <button class="action-btn" id="btn-mapa" onclick="toggleMapa()">MAPA</button>
            <button class="action-btn btn-main" onclick="usarEscanear()">ESCANEAR</button>
            <button class="action-btn" id="btn-magia" onclick="usarMagia()">MAGIA</button>
        </div>
        <div class="orb orb-blue"><div class="orb-liquid" id="orb-mana"></div></div>
    </div>
</div>

<script>
    let map;
    const canvas = document.getElementById('fog-canvas');
    const ctx = canvas.getContext('2d');
    const vidaLiquid = document.getElementById('orb-vida');
    const manaLiquid = document.getElementById('orb-mana');
    const btnMagia = document.getElementById('btn-magia');
    const playerMarker = document.getElementById('player-marker');
    
    // Fallback temporário (só para a tela não ficar branca antes do GPS)
    let currentLatLng = [-23.6225, -46.5546]; 
    let initialZoom = 18; 
    let mapZoomOut = 16;  
    
    let visitedPath = [];
    let isMapOpen = false;
    let isInventoryOpen = false;
    
    // A MÁGICA DO RASTRO: Flag para saber se já achamos o jogador na vida real
    let firstLocationFound = false;
    
    let sanidade = 100;
    let energia = 100;
    let baseEraserRadius = 45; 
    let raioMagiaMultiplicador = 1;
    let magiaOnCooldown = false;

    const keys = { w: false, a: false, s: false, d: false };
    window.addEventListener('keydown', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

    function inicializarJogo() {
        map = L.map('map', {
            zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, touchZoom: false
        }).setView(currentLatLng, initialZoom);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO', maxZoom: 19
        }).addTo(map);

        redimensionarCanvas();
        window.addEventListener('resize', redimensionarCanvas);

        // AQUI ESTÁ A CORREÇÃO: Não empurramos mais o "visitedPath" no início. Ele começa vazio.

        iniciarGPS();
        requestAnimationFrame(gameLoop);
    }

    function redimensionarCanvas() {
        const vp = document.getElementById('viewport');
        canvas.width = vp.clientWidth;
        canvas.height = vp.clientHeight;
    }

    // --- INTERFACE (Mesmo código anterior) ---
    function toggleMochila() {
        isInventoryOpen = !isInventoryOpen;
        document.getElementById('inventory-overlay').style.display = isInventoryOpen ? 'flex' : 'none';
    }
    function usarItemVida() { sanidade = Math.min(100, sanidade + 30); }
    function usarEscanear() {
        if (energia < 15) return;
        energia -= 15; 
        let pulse = document.createElement('div');
        pulse.classList.add('radar-pulse');
        pulse.style.left = '50%'; pulse.style.top = '50%';
        document.getElementById('viewport').appendChild(pulse);
        setTimeout(() => pulse.remove(), 1500);
    }
    function usarMagia() {
        if (energia < 40 || magiaOnCooldown) return;
        energia -= 40; magiaOnCooldown = true;
        btnMagia.classList.add('btn-cooldown');
        btnMagia.innerText = "05s";
        raioMagiaMultiplicador = 3; 
        setTimeout(() => { raioMagiaMultiplicador = 1; }, 2000);
        let cooldownTempo = 5;
        let timer = setInterval(() => {
            cooldownTempo--;
            btnMagia.innerText = `0${cooldownTempo}s`;
            if(cooldownTempo <= 0) {
                clearInterval(timer); magiaOnCooldown = false;
                btnMagia.classList.remove('btn-cooldown'); btnMagia.innerText = "MAGIA";
            }
        }, 1000);
    }
    function toggleMapa() {
        isMapOpen = !isMapOpen;
        const btn = document.getElementById('btn-mapa');
        if (isMapOpen) {
            btn.innerText = "VOLTAR"; btn.classList.add('btn-map-active');
            map.dragging.enable(); map.touchZoom.enable(); map.setZoom(mapZoomOut); 
            playerMarker.style.display = 'none';
        } else {
            btn.innerText = "MAPA"; btn.classList.remove('btn-map-active');
            map.dragging.disable(); map.touchZoom.disable(); map.setView(currentLatLng, initialZoom); 
            if(firstLocationFound) playerMarker.style.display = 'block';
        }
    }

    // ==========================================
    // SISTEMA DE GPS (CORREÇÃO DO ESCORREGÃO)
    // ==========================================
    function iniciarGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(atualizarPosicaoGPS, erroGPS, {
                enableHighAccuracy: true, maximumAge: 0, timeout: 5000
            });
        }
    }

    function atualizarPosicaoGPS(posicao) {
        currentLatLng = [posicao.coords.latitude, posicao.coords.longitude];
        document.getElementById('txt-gps').innerText = `Sinal Real | Precisão: ${Math.round(posicao.coords.accuracy)}m`;
        document.getElementById('led-gps').style.background = "#00ff00"; 
        document.getElementById('led-gps').style.boxShadow = "0 0 10px #00ff00";

        // A CORREÇÃO: Se for a primeiríssima vez, não liga com a posição anterior!
        if (!firstLocationFound) {
            firstLocationFound = true;
            visitedPath = [[...currentLatLng]]; // Zera o histórico e põe só o ponto real
            playerMarker.style.display = 'block'; // Mostra o avatar
            map.setView(currentLatLng, initialZoom, {animate: false}); // Pula a câmera direto pro lugar certo
        } else {
            salvarRastro();
        }
    }

    function erroGPS(err) {
        document.getElementById('txt-gps').innerText = "Usando Teclado (WASD)";
        document.getElementById('led-gps').style.background = "yellow";
        document.getElementById('led-gps').style.boxShadow = "0 0 10px yellow";
    }

    function simularPassos() {
        let moveu = false;
        const passo = 0.000015; 
        
        if (keys.w) { currentLatLng[0] += passo; moveu = true; } 
        if (keys.s) { currentLatLng[0] -= passo; moveu = true; } 
        if (keys.a) { currentLatLng[1] -= passo; moveu = true; } 
        if (keys.d) { currentLatLng[1] += passo; moveu = true; } 

        if (moveu) {
            document.getElementById('txt-gps').innerText = `Simulação WASD Ativa`;
            document.getElementById('led-gps').style.background = "yellow"; 
            document.getElementById('led-gps').style.boxShadow = "0 0 10px yellow";
            
            // Permite usar o WASD como primeiro pulso caso não tenha GPS no PC
            if (!firstLocationFound) {
                firstLocationFound = true;
                visitedPath = [[...currentLatLng]];
                playerMarker.style.display = 'block';
                map.setView(currentLatLng, initialZoom, {animate: false});
            } else {
                salvarRastro();
            }
        }
    }

    function salvarRastro() {
        const ultimoPonto = visitedPath[visitedPath.length - 1];
        const distMetros = map.distance(ultimoPonto, currentLatLng);
        if (distMetros > 1.0) { 
            visitedPath.push([...currentLatLng]);
        }
    }

    // ==========================================
    // RENDERIZAÇÃO
    // ==========================================
    function gameLoop() {
        sanidade -= 0.01; energia += 0.05;  
        if(sanidade < 0) sanidade = 0; if(energia > 100) energia = 100;
        vidaLiquid.style.height = `${sanidade}%`; manaLiquid.style.height = `${energia}%`;

        if (!isMapOpen && firstLocationFound) {
            simularPassos();
            map.panTo(currentLatLng, {animate: false}); 
        }

        // --- PINTA A NEBLINA ---
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(15, 18, 22, 0.98)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Se o GPS ainda não pegou, mantém tudo escuro e sai da função
        if (!firstLocationFound || visitedPath.length === 0) {
            requestAnimationFrame(gameLoop);
            return;
        }

        // --- APAGA A NEBLINA ---
        ctx.globalCompositeOperation = 'destination-out';
        
        let currentZoom = map.getZoom();
        let scaleMultiplier = Math.pow(2, currentZoom - initialZoom);
        let dynamicRadius = (baseEraserRadius * scaleMultiplier) * raioMagiaMultiplicador;

        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.lineWidth = dynamicRadius * 2;
        ctx.shadowBlur = dynamicRadius * 0.8;
        ctx.shadowColor = 'black';
        ctx.strokeStyle = 'rgba(0,0,0,1)';

        ctx.beginPath();
        for (let i = 0; i < visitedPath.length; i++) {
            let pontoNaTela = map.latLngToContainerPoint(visitedPath[i]);
            if (i === 0) ctx.moveTo(pontoNaTela.x, pontoNaTela.y);
            else ctx.lineTo(pontoNaTela.x, pontoNaTela.y);
        }
        ctx.stroke();

        requestAnimationFrame(gameLoop);
    }

    window.onload = inicializarJogo;
</script>
</body>
</html>
